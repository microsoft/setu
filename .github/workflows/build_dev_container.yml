name: Build and Push Dev Container
on:
  push:
    branches: [main]
    paths:
      - "docker/containers/dev/**"
      - "setup.py"
      - "requirements.txt"
      - "environment-dev.yml"
      - "scripts/ci/**"
      - ".github/workflows/build_dev_container.yml"
  workflow_dispatch:
    inputs:
      cuda_version:
        required: true
        default: "12.9.0"
      pytorch_version:
        required: true
        default: "2.8"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: [self-hosted, cpu]
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.9.0"]
        torch: ["2.8"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/setu-dev-cuda${{ matrix.cuda }}-torch${{ matrix.torch }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD-HHmmss'}}-
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/containers/dev/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            PYTORCH_VERSION=${{ matrix.torch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
