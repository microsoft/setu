name: "Run Linters"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
defaults:
  run:
    shell: bash -l {0}
jobs:
  sanity_check:
    runs-on: [self-hosted, cpu]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Install Conda environment from environment-dev.yml
        uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d # v1.11.0
        with:
          environment-file: environment-dev.yml
      - name: "Run black"
        run: make lint/black
      - name: "Run isort"
        run: make lint/isort
      - name: "Run autoflake"
        run: make lint/autoflake
      - name: "Run cpplint"
        run: make lint/cpplint
      - name: "Run clang-format"
        run: make lint/clang-format
      - name: "Run codespell"
        run: make lint/codespell
      - name: "Run shellcheck"
        run: make lint/shellcheck
      - name: "Run cmake-lint"
        run: make lint/cmake-lint
